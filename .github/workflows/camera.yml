name: Build Camera APK

on:
  workflow_dispatch:   # Actions 탭에서 "Run workflow" 버튼으로 실행

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet and camera extension
        run: |
          pip install flet-camera
          VER=$(python -c "import importlib.metadata as m; print(m.version('flet-camera'))")
          echo "flet-camera version: $VER"
          pip install "flet[all]==$VER"
          echo "$VER" > flet_version.txt

      - name: Prepare camera project (shares src/main.py with the stable app)
        run: |
          VER=$(cat flet_version.txt)
          mkdir -p camera_build/src/assets
          cp src/main.py camera_build/src/main.py
          if [ -d src/assets ]; then cp -r src/assets/. camera_build/src/assets/; fi
          cat > camera_build/pyproject.toml <<EOF
          [project]
          name = "sbkit-cam"
          version = "1.0.0"
          description = "SB-kit camera test build"
          dependencies = [
            "flet==$VER",
            "flet-camera==$VER",
            "pillow",
          ]

          [tool.flet]
          org = "com.example"
          product = "SB-kit Cam"
          company = "personal"
          copyright = "personal use"
          build_number = 1

          [tool.flet.app]
          path = "src"
          module = "main"

          [tool.flet.android.permission]
          "android.permission.CAMERA" = true
          EOF
          cat camera_build/pyproject.toml

      - name: Build APK
        working-directory: camera_build
        run: yes | flet build apk --verbose   # Flutter 설치 질문에 자동으로 y 대답

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sbkit-camera-apk
          path: camera_build/build/apk
